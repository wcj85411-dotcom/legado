name: Personal Reader Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - personal-reader-development
    paths:
      - 'app/src/main/java/io/legado/app/service/TTSReadAloudService.kt'
      - '.github/workflows/personal-reader-signed-release.yml'

permissions:
  contents: read

concurrency:
  group: personal-reader-signed-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: personal-reader-development
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.READER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.READER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.READER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.READER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing READER_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing READER_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing READER_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing READER_KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/reader-release.jks"
          test -s "$RUNNER_TEMP/reader-release.jks"
          {
            printf 'RELEASE_STORE_FILE=%s\n' "$RUNNER_TEMP/reader-release.jks"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } >> "$GITHUB_WORKSPACE/gradle.properties"

      - name: Build signed ARM release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleAppRelease -ParmOnly=true --no-daemon --stacktrace

      - name: Verify APK signature
        env:
          EXPECTED_CERT_SHA256: 1CB922D40016E2EF44F1A023F2748EE592CF277A63C99CBC8D01FF470478E2AD
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          apksigner verify --verbose --print-certs "$APK"
          ACTUAL="$(apksigner verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print toupper($2); exit}' | tr -d ':')"
          test "$ACTUAL" = "$EXPECTED_CERT_SHA256" || {
            echo "Signing certificate does not match the previously configured fixed certificate."
            exit 1
          }
          mkdir -p signed-release
          cp "$APK" signed-release/personal-reader-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-reader-signed-release
          path: signed-release/personal-reader-release.apk
          if-no-files-found: error
          retention-days: 14
