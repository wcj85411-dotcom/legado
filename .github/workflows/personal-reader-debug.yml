name: Personal Reader Debug Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-reader-debug
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: personal-reader-development
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare optional generated asset
        run: |
          mkdir -p app/src/main/assets
          touch app/src/main/assets/18PlusList.txt

      - name: Run debug unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testAppDebugUnitTest -ParmOnly=true --no-daemon --stacktrace

      - name: Build unsigned debug APK
        run: |
          ./gradlew :app:assembleAppDebug -ParmOnly=true --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: personal-reader-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
